


[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[respond]

[exclude_object]

[force_move]
enable_force_move: true

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

# Не работающий пин (левый) для корректной работы HeatSoakTimers
[output_pin Printer_Lights]
pin:PC6
pwm: 1
value:1
cycle_time: 0.010