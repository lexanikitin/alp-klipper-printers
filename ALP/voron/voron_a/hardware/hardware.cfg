# ======================================================================
#                          ОГЛАВЛЕНИЕ
# ======================================================================
# I.   ОБЩИЕ НАСТРОЙКИ И КОММЕНТАРИИ
# II.  ШАГОВЫЕ ДВИГАТЕЛИ (X, Y, Z, E)
# III. НАГРЕВАТЕЛИ (Экструдер, Стол)
# IV.  ДАТЧИКИ ТЕМПЕРАТУРЫ
# V.   ВЕНТИЛЯТОРЫ (Обдув, радиатор, плата)
# VI.  КОНТРОЛЛЕРЫ (MCU, хосты, ADXL)
# VII. ИНТЕРФЕЙСЫ И ЭКРАНЫ (LCD, LED, пины)

# IX.  КАЛИБРОВКА (Probe, Mesh, Screws)
# X.   СКОРОСТИ И УСКОРЕНИЯ [printer]
# XI.  МАКРОСЫ (переопределения, START, END)
# ======================================================================

# ======================================================================
# II. ШАГОВЫЕ ДВИГАТЕЛИ (Оси и экструдер)
# ======================================================================
#####################################################################
#   B(X) ---------A(Y)
#   |                |
#   |--------E-------|
#   |                |
#   |                |
#   |                |
#####################################################################
##                   X-axis on MOTOR_0(B Motor)
#####################################################################

[stepper_x]
step_pin: PE11                  # X-axis motor pulse pin setting
dir_pin: !PE10                  # X-axis motor direction pin setting
enable_pin: !PE9                # X-axis motor enable pin setting
rotation_distance: 40           # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
microsteps: 32                  # Motor microsteps Setting
full_steps_per_rotation:200     # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: EBBCan: PB6        # Limit switch PIN pin setting（X-）
position_min: 0                 # X-axis minimum travel - software limit
position_endstop: 350           # Mechanical reset point coordinates for X-axis (change to 350 for 350 models)
position_max: 350               # X-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 50                # Reset speed maximum 100
homing_retract_dist: 5          # Setback distance after the first trigger of the reset switch
homing_positive_dir: true       # Direction of reset (generally no change required)

[tmc2209 stepper_x]
uart_pin: PE7                   # drive communications port
interpolate: True               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

#####################################################################
##                   Y-axis on MOTOR_1(A Motor)
#####################################################################

[stepper_y]
step_pin: PD8                   # Y-axis motor pulse pin setting
dir_pin: !PB12                  # Y-axis motor direction pin setting
enable_pin: !PD9                # Y-axis motor enable pin setting
rotation_distance: 40           # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
microsteps: 32                  # Motor microsteps Setting
full_steps_per_rotation:200     # Number of pulses required for a single motor revolution (1.8 degree motor: 200, 0.9 degree motor: 400)
endstop_pin: ^PB13              # Limit switch PIN pin setting（Y-）
position_min: 0                 # X-axis minimum travel - software limit
position_endstop: 350           # Mechanical reset point coordinates for Y-axis (change to 350 for 350 models)
position_max: 350               # Y-axis maximum travel - software limit (change to 350 for 350 models)
homing_speed: 50                # Reset speed maximum 100
homing_retract_dist: 5          # Setback distance after the first trigger of the reset switch
homing_positive_dir: true       # Direction of reset (generally no change required)

[tmc2209 stepper_y]
uart_pin: PE15                  # drive communications port
interpolate: True               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

#####################################################################
#   z1 -------------- z2
#   |                 |
#   |                 |
#   |                 |
#   |                 |
#  z0---   display ---z3
#####################################################################
##                  Z0-axis
#####################################################################

##		Z0-axis on MOTOR2_1(left front)
[stepper_z]
step_pin: PD14                          # Z-axis motor pulse pin
dir_pin: !PD13                          # Z-axis motor direction pin setting
enable_pin: !PD15                       # Z-axis motor enable pin setting
rotation_distance: 40                   # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16                       # reduction ratio
microsteps: 16                          # microsteps
endstop_pin: probe:z_virtual_endstop    # Limit switch interface
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: -0.5
position_max: 340                       # Maximum Z-axis print height   350mm=340
position_min: -5                        # Soft Limit Minimum Stroke
homing_speed: 10                        # Reset speed - maximum 20
second_homing_speed: 3                  # Secondary reset speed - maximum 10
homing_retract_dist: 3                  # Retreat distance

[tmc2209 stepper_z]
uart_pin: PD10                  # drive communications port
interpolate: True               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

##		Z1-axis on MOTOR3(left rear)
[stepper_z1]
step_pin: PE6                   # Z1-axis motor pulse pin
dir_pin: PC13                   # Z1-axis motor direction pin setting
enable_pin: !PE5                # Z1-axis motor enable pin setting
rotation_distance: 40           # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16               # reduction ratio
microsteps: 16                  # microsteps

[tmc2209 stepper_z1]
uart_pin: PC14                  # drive communications port
interpolate: True               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

##		Z2-axis on MOTOR4(right-rear)
[stepper_z2]
step_pin: PE2                   # Z2-axis motor pulse pin
dir_pin: !PE4                   # Z2-axis motor direction pin setting
enable_pin: !PE3                # Z2-axis motor enable pin setting
rotation_distance: 40           # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16               # reduction ratio
microsteps: 16                  # microsteps

[tmc2209 stepper_z2]
uart_pin: PC15                  # drive communications port
interpolate: true               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

##		Z3-axis on MOTOR5(right-front)
[stepper_z3]
step_pin: PD12                  # Z3-axis motor pulse pin
dir_pin: PC4                    # Z3-axis motor direction pin setting
enable_pin: !PE8                # Z3-axis motor enable pin setting
rotation_distance: 40           # Active pulley circumference mm (2GT-20T pulley 40, 2GT-16T pulley 32)
gear_ratio: 80:16               # reduction ratio
microsteps: 16                  # microsteps

[tmc2209 stepper_z3]
uart_pin: PA15                  # drive communications port
interpolate: true               # Whether to enable 256 microstep interpolation
run_current: 0.8                # Motor running current value(mA)
hold_current: 0.8               # holding current(mA)
sense_resistor: 0.110           # Do not change the drive sampling resistor
stealthchop_threshold: 200      # Mute threshold

# ======================================================================
# III. НАГРЕВАТЕЛЬ СТОЛА
# ======================================================================

[heater_bed]
heater_pin: PB4
sensor_type: Generic 3950               # NTC 100K MGB18-104F39050L32
sensor_pin: PB0                         # TB sensor interface
max_power: 0.6                          # Adjust Max Power so your heater doesn't warp your bed
min_temp: 0
max_temp: 120
control: pid
pid_Kp: 38.891
pid_Ki: 0.803
pid_Kd: 471.072

# ======================================================================
# IV. ДОПОЛНИТЕЛЬНЫЕ ДАТЧИКИ ТЕМПЕРАТУРЫ (Корпус, влажность и т.д.)
# ======================================================================

[temperature_sensor EBB_NTC]
sensor_type: Generic 3950
sensor_pin: EBBCan: PA2

[temperature_sensor HOST]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[temperature_sensor MCU]
sensor_type: temperature_mcu
sensor_mcu: mcu
min_temp: 0
max_temp: 100

# ======================================================================
# V. ВЕНТИЛЯТОРЫ
# ======================================================================

[heater_fan hotend_fan]
pin: EBBCan: PA0
heater: extruder
heater_temp: 50.0
max_power: 1.0
kick_start_time: 0.5

[fan]
##	Print Cooling Fan - FAN1 Connector
pin: EBBCan: PA1
max_power: 1.0
# change to 0.4 if you're having problems with heater not extruding at expected rate
##  Uncomment below for SpiderVersion 1.x
#pin: PB1
##  Uncomment below for SpiderVersion 2.2
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan controller_fan]
##	Controller fan - FAN2 Connector
pin: PB2
kick_start_time: 0.5
heater: heater_bed
heater_temp: 45.0

#[heater_fan exhaust_fan]
##  Exhaust fan - In E2 OUT Positon
#pin: PB3
#max_power: 1.0
#shutdown_speed: 0.0
#kick_start_time: 5.0
#heater: heater_bed
#heater_temp: 60
#fan_speed: 1.0

#[controller_fan nevermore]
# Nevermore - In E1 OUT Position
#pin: PC8
#kick_start_time: 0.500
#fan_speed: 0.5

# ======================================================================
# VI. КОНТРОЛЛЕРЫ (MCU, Raspberry Pi, акселерометр)
# ======================================================================

[mcu host]
serial : /tmp/klipper_host_mcu

[mcu]
canbus_uuid: 2e5dd68142bb
canbus_interface : can0

[mcu EBBCan]
canbus_uuid: c7ec876885e9
canbus_interface : can0

[adxl345]
cs_pin: EBBCan: PB12
spi_bus: spi2_PB2_PB11_PB10
axes_map: z,-y,x

[resonance_tester]
probe_points: 100, 100, 20
accel_chip: adxl345

[input_shaper]
shaper_freq_x: 57.0
shaper_type_x: mzv
shaper_freq_y: 42.2
shaper_type_y: mzv

[printer]
max_accel: 7000

# ======================================================================
# VII. ИНТЕРФЕЙСЫ (Экраны, светодиоды, пользовательские пины)
# ======================================================================

[display]
#	mini12864 LCD Display
lcd_type: uc1701
cs_pin: PC11
a0_pin: PD2
rst_pin: PC10
encoder_pins: ^PC6,^PC7
click_pin: ^!PA8
contrast: 63
#spi_bus: spi1
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6
spi_software_sclk_pin: PA5

[neopixel fysetc_mini12864]
#	To control Neopixel RGB in mini12864 display
pin: PC12
chain_count: 3
initial_RED: 0.1
initial_GREEN: 0.5
initial_BLUE: 0.0
color_order: RGB

#	Set RGB values on boot up for each Neopixel.
#	Index 1 = display, Index 2 and 3 = Knob
[delayed_gcode setdisplayneopixel]
initial_duration: 1
gcode:
    SET_LED LED=fysetc_mini12864 RED=1 GREEN=1 BLUE=1 INDEX=1 TRANSMIT=0
    SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=2 TRANSMIT=0
    SET_LED LED=fysetc_mini12864 RED=1 GREEN=0 BLUE=0 INDEX=3

# ======================================================================
# VIII. ГОЛОВЫ
# ======================================================================

[extruder]
step_pin: EBBCan: PD0
dir_pin: EBBCan: PD1
enable_pin: !EBBCan: PD2
microsteps: 16
rotation_distance : 12.837
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: EBBCan: PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: EBBCan: PA3
control: pid
min_temp: 0
max_temp: 300
gear_ratio: 50:17				        # BMG Gear Ratio
full_steps_per_rotation: 200	        # 200 for 1.8 degree, 400 for 0.9 degree
max_power: 1.0
min_extrude_temp: 170
pressure_advance: 0.05                  # Try to keep pressure_advance below 1.0
pressure_advance_smooth_time: 0.040     # Default is 0.040, leave stock
pid_Kp: 26.075
pid_Ki: 2.094
pid_Kd: 81.160

#[tmc2209 extruder]
#uart_pin: EBBCan: PA15
#run_current: 0.650
#stealthchop_threshold: 999999
#interpolate: false
#hold_current: 0.2
#sense_resistor: 0.110

[tmc2240 extruder]
cs_pin: EBBCan: PA15
spi_bus: spi2_PB2_PB11_PB10
driver_TPFD: 0
run_current: 0.60
stealthchop_threshold: 999999

[verify_heater extruder]                # Heating Block Temperature Tolerance Configuration
max_error : 120                         # maximum error
check_gain_time : 120                   # tolerance time
hysteresis : 50                         # tolerance temperature
heating_gain : 2                        # Heating Gain

# ======================================================================
# IX. КАЛИБРОВКА (Датчик Z, Bed Mesh, Винты стола)
# ======================================================================

[bed_mesh]
speed : 80                    # Calibration speed
horizontal_move_z : 10        # Z-axis movement speed
mesh_min : 30,30              # Minimum calibration point coordinates x, y
mesh_max : 270, 270           # Maximum calibration point coordinates x, y
probe_count : 7,7             # Number of sampling points (7X7 is 49 points)
mesh_pps : 2,2                # Number of supplementary sampling points
algorithm : bicubic           # algorithmic model
bicubic_tension : 0.2         # Algorithmic interpolation don't move

[homing_override]
axes : z
set_position_z : 0
gcode :
    G90
    G0 Z5 F1800
    G28 X Y
    G0 X175 Y175 F7200    #350mm
    G28 Z
    G0 Z10  F1800
    G0 X175 Y175 Z30 F1800

[probe]
pin: EBBCan: PB5
x_offset: 0
y_offset: 0
z_offset: -0.315
speed: 10.0
samples: 3
samples_result: median
sample_retract_dist: 3.0
samples_tolerance: 0.006
samples_tolerance_retries: 3

[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions
gantry_corners:
    -60,-10
    410,420
##	Probe points
points:
    50,25
    50,275
    300,275
    300,25

speed: 100
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

#[bltouch]
##	Bltouch - If you use this section , please comment the [probe] section
##	More infomation at : https://www.klipper3d.org/BLTouch.html
##	This bltouch is not used for Z height, only Quad Gantry Leveling
##	In Z+ Position
#sensor_pin: PA0
##	In Y+ Position
#control_pin: PA2
#x_offset: 0
#y_offset: 25.0
#z_offset: 0
#speed: 10.0
#samples: 3
#samples_result: median
#sample_retract_dist: 3.0
#samples_tolerance: 0.006
#samples_tolerance_retries: 3

#[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -100,-100 to the XY coordinates of your endstop pin
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#home_xy_position:-100,-100
#speed:100
#z_hop:10

# ======================================================================
# X. ОСНОВНЫЕ НАСТРОЙКИ ПРИНТЕРА (Кинематика, скорости)
# ======================================================================

[printer]
kinematics: corexy              # Printer type：corexy
max_velocity: 300               # Maximum speed (max. 300)
max_accel: 3000                 # Maximum acceleration (max. 4000)
max_z_velocity: 15              # Z-axis maximum speed
max_z_accel: 350                # Z-axis maximum acceleration
square_corner_velocity: 5.0     # Square corner speed

[save_variables]
filename = ~/printer_data/config/demon_vars.cfg

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[pause_resume]

[respond]

[exclude_object]

[force_move]
enable_force_move: True

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30
