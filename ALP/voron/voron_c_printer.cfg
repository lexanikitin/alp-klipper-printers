#####################################################################
##	          Индивидуальные значения параметров
#####################################################################

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f446xx_170037000851313133353932-if00

[mcu EBBCan]
canbus_uuid: b57eb23f8879

#####################################################################
##	                 Калибровочные значения
#####################################################################

# 1. Калибровка ПИД экструдера
[extruder]
pid_Kp: 26.881
pid_Ki: 2.560
pid_Kd: 70.561

# 2. Калибровка ПИД стола
[heater_bed]
pid_Kp: 58.332
pid_Ki: 1.861
pid_Kd: 457.178

# 3. Калибровка разрешения экструдера https://www.klipper3d.org/Rotation_Distance.html
##	When performing extruder calibration, update the following values
##	Let's say you ask for a 100mm feed, but it's actually 98mm ,
##	New value = old value x (actual extrusion length / target length)
[extruder]
rotation_distance : 22.136

# 4. z-offset
[probe]
# z_offset: 3.405
z_offset: -0.67

[input_shaper]
shaper_freq_x: 60.6
shaper_type_x: mzv
shaper_freq_y: 45.6
shaper_type_y: mzv

[printer]
max_accel: 6100

[idle_timeout]
gcode:
    _DEMON_IDLE_TIMEOUT
timeout: 3600

[firmware_retraction]
retract_length: 0.8
retract_speed: 30
unretract_extra_length: 0.0
unretract_speed: 30

[include ./voron_c/Demon_Klipper_Essentials_Unified/*.cfg]
[include ./voron_c/Demon_User_Files/*.cfg]
[include ./voron_c/KAMP_LiTE/*.cfg]
[include ./voron_c/*.cfg]
[include voron_c_my_macros.cfg]
