[authorization]
trusted_clients:
    127.0.0.0/8
    192.168.5.0/24
    FC00::/7
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    http://*.4sst.ru
    https://*.4sst.ru
    *.4sst.ru
    *://mainsail.4sst.ru
    *://localhost
    *://localhost:*

[update_manager]
channel: dev
refresh_interval: 168

[update_manager mainsail]
path: /home/aniki/mainsail
repo: mainsail-crew/mainsail
channel: stable
type: web
persistent_files:
    config.json

[update_manager alp-klipper-printers]
managed_services: klipper
origin: https://github.com/lexanikitin/alp-klipper-printers.git
path: /home/aniki/alp-klipper-printers
primary_branch: main
type: git_repo

[power MainSwitch]
type: gpio
pin: host:gpiochip1/gpio117
value: False                 # Выключено при старте системы
shutdown_value: False        # Выключить при программном стопе Moonraker